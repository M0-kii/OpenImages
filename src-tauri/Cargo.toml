[package]
name = "openimages"
version = "0.1.0"
description = "Local image toolkit"
authors = ["you"]
edition = "2021"

[lib]
name = "openimages_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

image = "0.25"
kamadak-exif = "0.6"
base64 = "0.22"
fast_image_resize = { version = "6.1.0", features = ["image"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Image decoding/encoding is unusably slow in an unoptimized debug build
# (multi-second waits on a 12MP JPEG). Optimize deps even in dev.
[profile.dev.package."*"]
opt-level = 3
